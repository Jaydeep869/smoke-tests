---
name: Integration Tests

on:
  # Manual trigger for on-demand runs.
  # NOTE: minder is always tested at mindersec/minder@main to prevent
  # impersonation attacks where a fork's malicious Makefile/compose
  # code could run with access to this repo's secrets.
  workflow_dispatch:
    inputs:
      test_tags:
        description: 'Robot Framework tag filter (e.g. "core", "smoke")'
        required: false
        default: ''

  # Weekly scheduled run
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 AM UTC

  # Run on PRs to validate test infrastructure changes
  pull_request:
    paths:
      - "scripts/**"
      - "minder-tests/**"
      - "resources/**"
      - "smoke-test-config*.yaml"
      - ".github/workflows/integration-tests.yml"
      - "requirements.txt"

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------
      # Checkout smoke-tests only.
      # We always test against mindersec/minder@main using pre-built
      # images — we do NOT checkout the minder repo or run its Makefile.
      # ------------------------------------------------------------------
      - name: Checkout smoke-tests
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Install test dependencies directly on the runner.
      # No container image needed for CI — the runner already has Python.
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Robot Framework and dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Download the minder CLI binary from the latest release.
      # This avoids building minder from source (saves ~10 minutes).
      # ------------------------------------------------------------------
      - name: Install minder CLI
        run: |
          MINDER_VERSION=$(curl -sf https://api.github.com/repos/mindersec/minder/releases/latest \
            | jq -r '.tag_name')
          echo "Downloading minder CLI ${MINDER_VERSION}..."
          curl -sL \
            "https://github.com/mindersec/minder/releases/download/${MINDER_VERSION}/minder_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin minder
          chmod +x /usr/local/bin/minder
          minder version

      # ------------------------------------------------------------------
      # Pull Minder compose file and start the stack using pre-built images.
      # docker compose up --wait blocks until all healthchecks pass —
      # no extra polling step needed.
      # ------------------------------------------------------------------
      - name: Download Minder docker-compose
        run: |
          curl -sLo docker-compose.minder.yaml \
            https://raw.githubusercontent.com/mindersec/minder/main/docker-compose.yaml

      - name: Start Minder Docker stack
        run: |
          # Pull images first so startup is fast and errors are clear
          docker compose -f docker-compose.minder.yaml pull
          # --wait blocks until all service healthchecks pass
          docker compose -f docker-compose.minder.yaml up -d --wait
        env:
          # bootstrap.sh waits independently, but --wait on compose
          # means we already know both minder + keycloak are healthy here
          KO_DOCKER_REPO: ""   # not needed — using pre-pulled images

      # ------------------------------------------------------------------
      # Bootstrap: create test user in Keycloak, obtain offline token,
      # trigger Minder user auto-enrollment, extract project ID.
      # bootstrap.sh has its own wait_for_url loops as a safety net.
      # ------------------------------------------------------------------
      - name: Bootstrap test user and project
        run: ./scripts/bootstrap.sh
        env:
          KEYCLOAK_URL: http://localhost:8081
          MINDER_API_URL: http://localhost:8080
          MINDER_BINARY: /usr/local/bin/minder
          OFFLINE_TOKEN_OUTPUT_PATH: ${{ github.workspace }}/offline.token
          CLIENT_ID: smoke-test-client

      # ------------------------------------------------------------------
      # Run Robot Framework tests directly on the runner (no container).
      # ------------------------------------------------------------------
      - name: Run smoke tests
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.test_tags }}" ]; then
            EXTRA_ARGS="-i ${{ github.event.inputs.test_tags }}"
          fi
          robot \
            --outputdir results \
            --pythonpath . \
            --xunit results/xoutput.xml \
            --loglevel INFO \
            ${EXTRA_ARGS} \
            minder-tests/
        env:
          MINDER_CONFIG: ${{ github.workspace }}/smoke-test-config.yaml
          MINDER_OFFLINE_TOKEN_PATH: ${{ github.workspace }}/offline.token
          MINDER_PROJECT: ${{ env.MINDER_PROJECT }}
          MINDER_TEST_ORG: ${{ secrets.MINDER_TEST_ORG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # ------------------------------------------------------------------
      # Results
      # ------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: results/
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Integration Test Results"
          path: results/xoutput.xml
          reporter: java-junit
          fail-on-error: true

      # ------------------------------------------------------------------
      # Teardown
      # ------------------------------------------------------------------
      - name: Show Minder logs on failure
        if: failure()
        run: docker compose -f docker-compose.minder.yaml logs minder --tail=100

      - name: Show Keycloak logs on failure
        if: failure()
        run: docker compose -f docker-compose.minder.yaml logs keycloak --tail=50

      - name: Teardown Minder stack
        if: always()
        run: docker compose -f docker-compose.minder.yaml down -v --remove-orphans
